<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 160" width="100%" height="100%">
  <defs>
    <!-- Royal Gold Gradients -->
    <linearGradient id="royalGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C368" />
      <stop offset="35%" stop-color="#B88E36" />
      <stop offset="70%" stop-color="#87651C" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>

    <linearGradient id="goldShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6" />
      <stop offset="35%" stop-color="#DFB858" />
      <stop offset="70%" stop-color="#9E7A2A" />
      <stop offset="100%" stop-color="#694F16" />
    </linearGradient>
  </defs>

  <!-- Left Icon Mark: Stylized 'R' with Curtain Drapes & Venetian Blinds -->
  <g transform="translate(15, 12)">
    <!-- Top small T/A badge -->
    <text x="35" y="10" font-family="'Montserrat', sans-serif" font-size="6.5" font-weight="700" letter-spacing="1.5" fill="#87651C" text-anchor="middle">S AND N CURTAINS</text>
    <text x="35" y="18" font-family="'Montserrat', sans-serif" font-size="5" font-weight="600" letter-spacing="2" fill="#7D756D" text-anchor="middle">T/A</text>

    <!-- The Stylized 'R' Monogram (Height ~80, Width ~65) -->
    <g transform="translate(5, 22)">
      <!-- Left Stem: Flowing pleated curtain with tieback -->
      <path d="M 12 4 C 15 4, 17 8, 18 16 C 19 24, 18 36, 17 48 C 16 52, 17 56, 21 60 C 23 62, 24 66, 22 76 C 21 82, 18 90, 15 94 C 13 96, 11 96, 12 94 C 14 88, 16 80, 16 70 C 15 64, 11 58, 10 52 C 9 44, 9 32, 11 20 C 11.5 12, 10 6, 12 4 Z" fill="url(#royalGold)" />
      
      <!-- Inner drape fold lines -->
      <path d="M 16 6 Q 19 28 15 50 Q 13 60 18 70 Q 20 82 17 93" stroke="url(#goldShine)" stroke-width="1.2" fill="none" opacity="0.9" />
      <path d="M 20 8 Q 22 28 18 52 Q 17 62 21 72 Q 22 84 19 93" stroke="url(#royalGold)" stroke-width="1" fill="none" opacity="0.8" />
      <path d="M 23 12 Q 24 28 20 52 Q 19 62 23 74 Q 24 86 21 93" stroke="url(#royalGold)" stroke-width="0.8" fill="none" opacity="0.6" />
      
      <!-- Curtain tie-back band with tassel ring -->
      <path d="M 9 52 Q 17 55 24 53 Q 24 57 17 58 Q 9 56 9 52 Z" fill="#FFF2D6" />
      <circle cx="24.5" cy="54" r="1.8" fill="#AA7C11" />
      <path d="M 24.5 56 L 23 64 L 26 64 Z" fill="url(#royalGold)" />

      <!-- Top Loop: Venetian / Roller Blinds motif with horizontal slats -->
      <path d="M 22 6 C 36 6, 48 8, 54 18 C 60 27, 58 40, 48 48 C 40 54, 30 55, 23 55" stroke="url(#royalGold)" stroke-width="3" fill="none" stroke-linecap="round" />
      
      <!-- Horizontal Blind Slats inside the loop -->
      <line x1="24" y1="14" x2="48" y2="14" stroke="url(#royalGold)" stroke-width="1.6" stroke-linecap="round" />
      <line x1="24" y1="21" x2="52" y2="21" stroke="url(#royalGold)" stroke-width="1.6" stroke-linecap="round" />
      <line x1="23" y1="28" x2="54" y2="28" stroke="url(#royalGold)" stroke-width="1.6" stroke-linecap="round" />
      <line x1="22" y1="35" x2="52" y2="35" stroke="url(#royalGold)" stroke-width="1.6" stroke-linecap="round" />
      <line x1="21" y1="42" x2="48" y2="42" stroke="url(#royalGold)" stroke-width="1.6" stroke-linecap="round" />
      <line x1="20" y1="49" x2="41" y2="49" stroke="url(#royalGold)" stroke-width="1.6" stroke-linecap="round" />

      <!-- Cord / Control bead string for blinds -->
      <line x1="50" y1="14" x2="50" y2="46" stroke="#DFB858" stroke-width="0.6" stroke-dasharray="1.5,1.5" />
      <circle cx="50" cy="47" r="1.2" fill="#87651C" />

      <!-- Right Leg of 'R': Sweeping grand drapery tail -->
      <path d="M 28 52 C 34 52, 42 56, 46 66 C 50 76, 56 86, 68 93 C 65 94, 58 94, 52 91 C 44 86, 38 75, 34 64 C 32 60, 30 56, 28 54 Z" fill="url(#royalGold)" />
      <path d="M 33 58 Q 42 74 58 91" stroke="#FFF2D6" stroke-width="1" fill="none" opacity="0.8" />
    </g>
  </g>

  <!-- Typography Brand Identity: Deep Rich Charcoal for Light Luxury Background -->
  <g transform="translate(100, 42)">
    <!-- "ROYAL" Primary Title in High-Elegance Serif -->
    <text x="0" y="44" font-family="'Cormorant Garamond', 'Cinzel', 'Playfair Display', serif" font-size="44" font-weight="600" letter-spacing="7" fill="#1C1713">ROYAL</text>
    
    <!-- Subtitle: CURTAINS AND BLINDS -->
    <g transform="translate(4, 62)">
      <line x1="0" y1="-5" x2="32" y2="-5" stroke="#9E7A2A" stroke-width="1.2" opacity="0.75" />
      <text x="110" y="0" font-family="'Montserrat', sans-serif" font-size="10" font-weight="600" letter-spacing="4.5" fill="#4A433D" text-anchor="middle">CURTAINS AND BLINDS</text>
      <line x1="188" y1="-5" x2="220" y2="-5" stroke="#9E7A2A" stroke-width="1.2" opacity="0.75" />
    </g>

    <!-- Refined Subtitle Location Line -->
    <text x="5" y="80" font-family="'Montserrat', sans-serif" font-size="8.5" font-weight="500" letter-spacing="2.5" fill="#857C72">ORIENTAL PLAZA · FORDSBURG · JOHANNESBURG</text>
  </g>
</svg>
